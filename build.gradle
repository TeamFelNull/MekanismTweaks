plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Mekanism 10.7.x for 1.21.1. The api jar holds mekanism.api (Upgrade, ...), the main jar holds the rest.
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    implementation "mekanism:Mekanism:${mekanism_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge.mods.toml takes the mod version from the jar (${file.jarVersion}), which reads this manifest entry
tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
