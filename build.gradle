plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.106'
}

version = mod_version
group = mod_group

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }
    server {
        programArgument '--nogui'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // Mekanism 10.5.x for 1.20.4. The api jar holds mekanism.api (Upgrade, ...), the main jar holds the rest.
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    implementation "mekanism:Mekanism:${mekanism_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// mods.toml takes the mod version from the jar (${file.jarVersion}), which reads this manifest entry
tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}
