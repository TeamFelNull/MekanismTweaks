buildscript {
    repositories {
        jcenter()
        maven {
            name "forge"
            url "https://files.minecraftforge.net/maven"
        }

        maven { url = "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'org.spongepowered.mixin'
apply plugin: 'eclipse'
apply plugin: 'idea'

version = mod_version
group = mod_group
archivesBaseName = "$mod_id-$minecraft_version"

def mekanismSourcesCommit = '321afd497c19e0051143035cfdc7de999aef8c3d'
def mekanismSourcesArchive = file("${gradle.gradleUserHomeDir}/caches/mekanism-sources/Mekanism-${mekanism_version}-${mekanismSourcesCommit}.zip")

sourceCompatibility = targetCompatibility = '1.8'
tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
compileJava {
    sourceCompatibility = targetCompatibility = '1.8'
}

minecraft {
    version "1.12.2-14.23.5.2847"
    runDir = "run"
    mappings = mappings_version
}

tasks.withType(JavaExec) {
    if (name == 'runClient' || name == 'runServer') {
        jvmArgs '-Dfml.coreMods.load=dev.felnull.mekanismtweaks.MekanismTweaks'
    }
}

repositories {
    mavenCentral()
    maven { url = "https://repo.spongepowered.org/maven" }


    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.k-4u.nl"
    }

    maven {
        name 'ForgeFS'
        url 'https://maven.minecraftforge.net/'
    }
}

configurations {
    embed
    compile.extendsFrom(embed)
}

dependencies {

    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        exclude module: 'guava'
        exclude module: 'commons-io'
        exclude module: 'gson'
    }

    deobfCompile 'curse.maven:Mekanism-268560:2835175'
    compileOnly files('libs/compile-api-stubs.jar')
    runtime 'mezz.jei:jei_1.12.2:4.16.1.302'
}

task prepareMekanismSources {
    description = 'Downloads the matching Mekanism sources for IntelliJ library search/navigation.'
    group = 'IDE'
    outputs.file mekanismSourcesArchive

    doLast {
        if (!mekanismSourcesArchive.exists()) {
            mekanismSourcesArchive.parentFile.mkdirs()
            ant.get(
                    src: "https://github.com/mekanism/Mekanism/archive/${mekanismSourcesCommit}.zip",
                    dest: mekanismSourcesArchive,
                    usetimestamp: true)
        }
    }
}

idea {
    module {
        downloadSources = true
        iml {
            withXml {
                def sourceUrl = "jar://${mekanismSourcesArchive.absolutePath.replace('\\', '/')}!/Mekanism-${mekanismSourcesCommit}/src/main/java"
                def libraries = it.asNode().component.orderEntry.library
                def mekanismLibrary = libraries.find { library ->
                    library.CLASSES.root.any { root -> root.@url.toString().contains('Mekanism-268560-2835175.jar') }
                }

                if (mekanismLibrary) {
                    mekanismLibrary.SOURCES[0].children().clear()
                    mekanismLibrary.SOURCES[0].appendNode('root', [url: sourceUrl])
                }
            }
        }
    }
}

ideaModule.dependsOn prepareMekanismSources

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        expand 'mod_id': mod_id, 'mod_name': mod_name, 'version': project.version,
                'mcversion': project.minecraft.version, 'mod_description': mod_description,
                'mod_author': mod_author
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

mixin {
    add sourceSets.main, mod_mixin_refmap.replace('${mod_id}', mod_id)
}

jar {
    from {
        configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'

    manifest {
        attributes(
                "FMLCorePlugin": mod_core_plugin.replace('${mod_group}', mod_group),
                "FMLCorePluginContainsFMLMod": "true",
        )
    }
}
jar.finalizedBy('reobfJar')
